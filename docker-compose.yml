# Runs the whole stack locally, and works unchanged on a VPS.
#
#   cp server/.env.example server/.env   # then fill it in
#   docker compose up --build
#
# On a platform with ephemeral disks (Render, Railway, Fly, Heroku) do NOT rely
# on the uploads volume below - set STORAGE_DRIVER=s3 instead, or ID images will
# disappear on the next deploy.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quickcheckin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-env}
      POSTGRES_DB: quickcheckin
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quickcheckin']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://quickcheckin:${POSTGRES_PASSWORD:-change-me-in-env}@db:5432/quickcheckin
      # nginx sits in front, so trust exactly one proxy hop for client IPs.
      TRUST_PROXY_HOPS: 1
    ports:
      - '4000:4000'
    volumes:
      - uploads:/app/uploads
    # Migrations run before the server accepts traffic. `migrate deploy` only
    # applies committed migrations - it never generates or resets anything.
    command: sh -c "npx prisma migrate deploy && node src/index.js"

  web:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  db-data:
  uploads:
