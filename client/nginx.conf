server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed asset filenames change on every build, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must never be cached, or browsers keep loading an old build that
  # points at asset files which no longer exist.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # A single-page app: every unknown path is a client route, not a missing file.
  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  gzip_min_length 1024;
}
